<!DOCTYPE html>
<html>
<head>
    <title>Enterprise AI Knowledge Platform</title>
    <style>
        body{
            font-family: Arial;
            background:#f5f7fa;
            text-align:center;
            margin-top:100px;
        }

        .box{
            width:600px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.1);
        }

        input{
            width:80%;
            padding:12px;
            margin-top:20px;
        }

        button{
            padding:12px 30px;
            margin-top:20px;
            background:#1677ff;
            color:white;
            border:none;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Enterprise AI Knowledge Platform</h1>

    <p>Intelligent Enterprise RAG System</p>

    <input id="question" placeholder="Ask something..." />

    <br>

    <button onclick="askAI()">Submit</button>

    <h3 id="result"></h3>

</div>

<script>

async function askAI(){

    let q = document.getElementById("question").value;

    let res = await fetch(`http://127.0.0.1:8000/ask?q=${q}`);

    let data = await res.json();

    document.getElementById("result").innerText = data.answer;
}

</script>

</body>
</html>
