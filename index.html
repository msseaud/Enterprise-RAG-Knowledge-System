<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>企业AI知识平台</title>

    <style>

        body {

            font-family: "Microsoft YaHei", sans-serif;

            background: linear-gradient(135deg,#eef2ff,#f8fafc);

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;
        }

        .container {

            width: 760px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {

            text-align: center;

            color: #1677ff;

            margin-bottom: 10px;

            font-size: 36px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 35px;

            font-size: 16px;
        }

        .input-group {

            display: flex;

            gap: 12px;

            margin-bottom: 20px;
        }

        input {

            flex: 1;

            padding: 15px;

            border-radius: 12px;

            border: 1px solid #d9d9d9;

            font-size: 16px;

            outline: none;
        }

        input:focus {

            border-color: #1677ff;
        }

        button {

            padding: 15px 28px;

            background: #1677ff;

            color: white;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.3s;
        }

        button:hover {

            opacity: 0.9;
        }

        .upload-box {

            margin-top: 10px;

            margin-bottom: 20px;
        }

        .answer {

            margin-top: 30px;

            padding: 22px;

            background: #f7f9fc;

            border-radius: 14px;

            line-height: 1.8;

            color: #333;

            min-height: 120px;
        }

        .meta {

            margin-top: 20px;

            font-size: 14px;

            color: #666;

            line-height: 1.8;
        }

        hr {

            border: none;

            border-top: 1px solid #e5e7eb;

            margin: 18px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>企业AI知识平台</h1>

    <p class="subtitle">

        智能企业级 RAG 知识库系统

    </p>

    <div class="input-group">

        <input
            type="text"
            id="question"
            placeholder="请输入你的问题..."
        >

        <button onclick="ask()">

            生成回答

        </button>

    </div>

    <div class="upload-box">

        <input type="file" id="pdfFile">

        <button onclick="uploadPDF()">

            上传文档

        </button>

    </div>

    <div id="result" class="answer">

        AI回答将在这里显示...

    </div>

</div>

<script>

async function ask() {

    const q = document.getElementById("question").value;

    const resultDiv = document.getElementById("result");

    if (!q) {

        resultDiv.innerHTML = "⚠️ 请输入问题";

        return;
    }

    resultDiv.innerHTML = "⏳ AI正在分析企业知识库...";

    try {

        const res = await fetch(

            "http://localhost:8000/ask?q=" + encodeURIComponent(q)

        );

        const data = await res.json();

        resultDiv.innerHTML = `

            <h3>AI回答结果</h3>

            <p>${data.answer}</p>

            <hr>

            <div class="meta">

                <b>系统状态：</b> ${data.status}<br>

                <b>响应耗时：</b> ${data.latency}<br>

                <b>引用文档数：</b> ${data.docs_used}

            </div>

        `;

    } catch (err) {

        resultDiv.innerHTML = `

            ❌ 后端连接失败

        `;

        console.error(err);
    }
}


async function uploadPDF() {

    const fileInput = document.getElementById("pdfFile");

    const file = fileInput.files[0];

    const resultDiv = document.getElementById("result");

    if (!file) {

        resultDiv.innerHTML = "⚠️ 请选择PDF文件";

        return;
    }

    const formData = new FormData();

    formData.append("file", file);

    resultDiv.innerHTML = "⏳ 正在上传并解析文档...";

    try {

        const res = await fetch(

            "http://localhost:8000/upload",

            {

                method: "POST",

                body: formData

            }

        );

        const data = await res.json();

        resultDiv.innerHTML = `

            <h3>文档上传成功</h3>

            <p><b>文件名：</b>${data.filename}</p>

            <p><b>字符数：</b>${data.characters}</p>

            <hr>

            <p>${data.text_preview}</p>

        `;

    } catch (err) {

        resultDiv.innerHTML = "❌ 文档上传失败";

        console.error(err);
    }
}

</script>

</body>

</html>
