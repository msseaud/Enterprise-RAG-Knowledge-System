<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG Knowledge System</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            margin-top: 80px;
        }

        .container {
            width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-right: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .answer {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
        }

        .loading {
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 RAG QA System</h1>

    <input type="text" id="question" placeholder="Ask something...">
    <button onclick="ask()">Ask</button>

    <div id="result" class="answer"></div>
</div>

<script>
async function ask() {
    const q = document.getElementById("question").value;
    const resultDiv = document.getElementById("result");

    if (!q) {
        resultDiv.innerHTML = "⚠️ Please enter a question.";
        return;
    }

    resultDiv.innerHTML = "<span class='loading'>⏳ Thinking...</span>";

    try {
        const res = await fetch(`http://127.0.0.1:8000/ask?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        resultDiv.innerHTML = `
            <b>Answer:</b><br>${data.answer}<br><br>
            <b>Retrieved:</b><br>${data.retrieved_docs.join("<br>")}
        `;
    } catch (err) {
        resultDiv.innerHTML = "❌ Error connecting to backend.";
    }
}
</script>

</body>
</html>
